schema_version: 1

context:
  name: pretab
  version: 1.0.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/OpenTabular/PreTab/archive/v${{ version }}.tar.gz
  sha256: e8a515f9334f75d61e8bdf755b73ad8ffad7f5000edcfb072c3f7440c4d83f02

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    # Upstream declares requires = ["poetry>=0.12"] with
    # build-backend = "poetry.masonry.api", which lives in poetry proper, not
    # poetry-core. Mirrored exactly rather than substituted.
    - poetry
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.24,<3.0
    - scikit-learn >=1.6,<2.0
    - scipy >=1.10,<2.0
    - pandas >=2.0,<3.0
tests:
  - python:
      imports:
        - pretab
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A python package for preprocessing tabular data
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/OpenTabular/PreTab

extra:
  recipe-maintainers:
    - jan-janssen
